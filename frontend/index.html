<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NER Smart Logistics | AI Logistics & Accessibility Intelligence</title>
  <meta name="description" content="AI-Based Smart Logistics & Accessibility Intelligence Platform for the North Eastern Region of India. Disaster-resilient emergency logistics command center.">
  
  <!-- Fonts: Plus Jakarta Sans for UI & JetBrains Mono for telemetry -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN for instant styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            command: {
              950: '#040711',
              900: '#080d1a',
              850: '#0e1526',
              800: '#141e34',
              750: '#1a2744',
              700: '#223256',
              600: '#314674',
              500: '#435e9c',
              border: '#1b2742',
              borderLight: '#2a3b61',
              accent: '#06b6d4',
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#f43f5e',
              purple: '#8b5cf6'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'SFMono-Regular', 'Menlo', 'monospace'],
            display: ['Plus Jakarta Sans', 'sans-serif']
          },
          animation: {
            'pulse-fast': 'pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'radar': 'radarSweep 4s linear infinite',
            'ping-slow': 'ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            radarSweep: {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(360deg)' }
            },
            glow: {
              '0%': { boxShadow: '0 0 5px rgba(6, 182, 212, 0.4)' },
              '100%': { boxShadow: '0 0 20px rgba(6, 182, 212, 0.9)' }
            }
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Google Maps JavaScript API with Places & Elevation -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDUfdOtrBhoMopr1fvuSON34JUkzFEgTJw&libraries=places,geometry,elevation"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-command-900 text-slate-100 font-sans min-h-screen antialiased selection:bg-cyan-500 selection:text-black overflow-x-hidden">
  
  <!-- App Container -->
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Dynamic View Loaded Here -->
  </div>

  <!-- Global Modal & Drawer Containers with high z-index -->
  <div id="modal-container" class="relative z-[9999]"></div>
  <div id="toast-container" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

  <!-- Scripts -->
  <script type="module" src="/src/app.js"></script>
</body>
</html>
